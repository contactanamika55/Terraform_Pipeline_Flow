name: Terraform Deploy

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - 'dev/**'
      - 'module/**'
      - '.github/workflows/deploymentpipe.yml'

  pull_request:
    branches:
      - main
    paths:
      - 'dev/**'
      - 'module/**'
      - '.github/workflows/deploymentpipe.yml'

permissions:
  contents: read

env:
  TF_WORKING_DIR: dev

jobs:

  terraform_plan:
    name: Terraform Plan
    runs-on: self-hosted

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Format
        working-directory: ${{ env.TF_WORKING_DIR }}
        shell: powershell
        run: terraform fmt -check -recursive

      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        shell: powershell
        run: terraform init -input=false

      - name: Terraform Validate
        working-directory: ${{ env.TF_WORKING_DIR }}
        shell: powershell
        run: terraform validate

      - name: Terraform Plan
        working-directory: ${{ env.TF_WORKING_DIR }}
        shell: powershell
        run: |
          Write-Host "======================================"
          Write-Host "Terraform Plan"
          Write-Host "======================================"

          terraform plan -input=false -var-file=terraform.tfvars -out=tfplan

          Write-Host "Terraform exit code: $LASTEXITCODE"

          if ($LASTEXITCODE -ne 0) {
            Write-Host "Terraform Plan FAILED"
            exit $LASTEXITCODE
          }

          Write-Host "Terraform Plan SUCCESS"
          Write-Host "Checking tfplan file..."

          Get-ChildItem -Force

          if (-not (Test-Path ".\tfplan")) {
            Write-Host "ERROR: tfplan file was not created."
            exit 1
          }

          Write-Host "SUCCESS: tfplan file exists."

          if (Test-Path "tfplan") {
            Write-Host "SUCCESS: tfplan created."
            Get-Item "tfplan"
          }
          else {
            Write-Error "ERROR: tfplan was not created."
            exit 1
          }

      - name: Upload Terraform Plan
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan
          path: dev/tfplan
          if-no-files-found: error
          retention-days: 1


  terraform_apply:
    name: Terraform Apply
    runs-on: self-hosted

    needs: terraform_plan

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        shell: powershell
        run: terraform init -input=false

      - name: Download Terraform Plan
        uses: actions/download-artifact@v4
        with:
          name: terraform-plan
          path: dev

      - name: Terraform Apply
        working-directory: ${{ env.TF_WORKING_DIR }}
        shell: powershell
        run: |
          Write-Host "Running Terraform Apply..."

          if (-not (Test-Path "tfplan")) {
            Write-Error "ERROR: tfplan was not downloaded."
            exit 1
          }

          terraform apply -input=false -auto-approve tfplan

          if ($LASTEXITCODE -ne 0) {
            Write-Error "Terraform apply failed."
            exit $LASTEXITCODE
          }

          Write-Host "Terraform Apply completed successfully."