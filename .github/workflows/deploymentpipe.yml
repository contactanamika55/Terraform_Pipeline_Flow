name: Terraform Deploy

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - 'dev/**'
      - 'module/**'
      - '.github/workflows/deploymentpipe.yml'

  pull_request:
    branches:
      - main
    paths:
      - 'dev/**'
      - 'module/**'
      - '.github/workflows/deploymentpipe.yml'

permissions:
  contents: read

env:
  TF_WORKING_DIR: dev
  TF_VARS_FILE: terraform.tfvars

jobs:

  # ==================================================
  # 1. Terraform Scan / Validation / Plan
  # ==================================================
  terraform_plan:
    name: Terraform Scan & Plan
    runs-on: self-hosted

    steps:

      # -----------------------------------------------
      # Checkout
      # -----------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # -----------------------------------------------
      # DEBUG - Check repository structure
      # -----------------------------------------------
      - name: Check Repository Structure
        shell: powershell
        run: |
          Write-Host "======================================"
          Write-Host "GITHUB WORKSPACE"
          Write-Host "======================================"
          Write-Host $env:GITHUB_WORKSPACE

          Write-Host ""
          Write-Host "======================================"
          Write-Host "ROOT DIRECTORY"
          Write-Host "======================================"
          Get-ChildItem $env:GITHUB_WORKSPACE

          Write-Host ""
          Write-Host "======================================"
          Write-Host "DEV DIRECTORY"
          Write-Host "======================================"

          $devPath = Join-Path $env:GITHUB_WORKSPACE "dev"

          if (Test-Path $devPath) {
              Get-ChildItem $devPath
          }
          else {
              Write-Error "ERROR: dev directory does NOT exist!"
              exit 1
          }

      # -----------------------------------------------
      # Azure Login
      # -----------------------------------------------
      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Azure Account
        shell: powershell
        run: az account show

      # -----------------------------------------------
      # Terraform
      # -----------------------------------------------
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      # -----------------------------------------------
      # Terraform Format
      # -----------------------------------------------
      - name: Terraform Format Check
        working-directory: ${{ env.TF_WORKING_DIR }}
        shell: powershell
        run: terraform fmt -check -recursive

      # -----------------------------------------------
      # Terraform Init
      # -----------------------------------------------
      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        shell: powershell
        run: terraform init

      # -----------------------------------------------
      # Terraform Validate
      # -----------------------------------------------
      - name: Terraform Validate
        working-directory: ${{ env.TF_WORKING_DIR }}
        shell: powershell
        run: terraform validate

      # -----------------------------------------------
      # Terraform Plan
      # -----------------------------------------------
      - name: Terraform Plan
        working-directory: ${{ env.TF_WORKING_DIR }}
        shell: powershell
        run: |
          terraform plan `
            -var-file="${{ env.TF_VARS_FILE }}" `
            -out=tfplan

      # -----------------------------------------------
      # Verify tfplan
      # -----------------------------------------------
      - name: Check Terraform Plan File
        working-directory: ${{ env.TF_WORKING_DIR }}
        shell: powershell
        run: |
          Write-Host "======================================"
          Write-Host "PLAN FILE CHECK"
          Write-Host "======================================"

          Get-Location
          Get-ChildItem

          if (-not (Test-Path "tfplan")) {
              Write-Error "ERROR: tfplan was NOT created!"
              exit 1
          }

          Write-Host ""
          Write-Host "SUCCESS: tfplan file exists."

      # -----------------------------------------------
      # Upload tfplan
      # -----------------------------------------------
      - name: Upload Terraform Plan
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan
          path: ${{ github.workspace }}/dev/tfplan
          if-no-files-found: error
          retention-days: 1


  # ==================================================
  # 2. Terraform Apply
  # ==================================================
  terraform_apply:
    name: Terraform Apply
    runs-on: self-hosted

    needs: terraform_plan

    steps:

      # -----------------------------------------------
      # Checkout
      # -----------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # -----------------------------------------------
      # Azure Login
      # -----------------------------------------------
      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Azure Account
        shell: powershell
        run: az account show

      # -----------------------------------------------
      # Terraform
      # -----------------------------------------------
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      # -----------------------------------------------
      # Terraform Init
      # -----------------------------------------------
      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        shell: powershell
        run: terraform init

      # -----------------------------------------------
      # Download Plan Artifact
      # -----------------------------------------------
      - name: Download Terraform Plan
        uses: actions/download-artifact@v4
        with:
          name: terraform-plan
          path: ${{ github.workspace }}/dev

      # -----------------------------------------------
      # Verify Downloaded Plan
      # -----------------------------------------------
      - name: Check Downloaded Terraform Plan
        working-directory: ${{ env.TF_WORKING_DIR }}
        shell: powershell
        run: |
          Write-Host "======================================"
          Write-Host "DOWNLOADED PLAN CHECK"
          Write-Host "======================================"

          Get-Location
          Get-ChildItem

          if (-not (Test-Path "tfplan")) {
              Write-Error "ERROR: Downloaded tfplan was NOT found!"
              exit 1
          }

          Write-Host ""
          Write-Host "SUCCESS: tfplan downloaded successfully."

      # -----------------------------------------------
      # Terraform Apply
      # -----------------------------------------------
      - name: Terraform Apply
        working-directory: ${{ env.TF_WORKING_DIR }}
        shell: powershell
        run: |
          terraform apply -auto-approve tfplan