name: Terraform Deploy

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - 'dev/**'
      - 'module/**'
      - '.github/workflows/deploymentpipe.yml'

  pull_request:
    branches:
      - main
    paths:
      - 'dev/**'
      - 'module/**'
      - '.github/workflows/deploymentpipe.yml'

permissions:
  contents: read

env:
  TF_WORKING_DIR: dev
  TF_VARS_FILE: terraform.tfvars

jobs:

  # ==================================================
  # 1. Terraform Scan / Validation / Plan
  # ==================================================
  terraform_plan:
    name: Terraform Scan & Plan
    runs-on: self-hosted

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Azure Account
        run: az account show

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Format Check
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform fmt -check -recursive

      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform init

      - name: Terraform Validate
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform validate

      - name: Terraform Plan
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform plan `
            -var-file="${{ env.TF_VARS_FILE }}" `
            -out=tfplan

      # Check that tfplan was actually created
      - name: Check Terraform Plan File
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          Write-Host "Current directory:"
          Get-Location

          Write-Host "Files in dev:"
          Get-ChildItem

          if (-not (Test-Path "tfplan")) {
            Write-Error "ERROR: tfplan file was NOT created!"
            exit 1
          }

          Write-Host "SUCCESS: tfplan file exists."

      # Upload tfplan as artifact
      - name: Upload Terraform Plan
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan
          path: ${{ github.workspace }}/dev/tfplan
          if-no-files-found: error
          retention-days: 1


  # ==================================================
  # 2. Terraform Apply
  # ==================================================
  terraform_apply:
    name: Terraform Apply
    runs-on: self-hosted

    needs: terraform_plan

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Azure Account
        run: az account show

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform init

      # Download artifact created by terraform_plan
      - name: Download Terraform Plan
        uses: actions/download-artifact@v4
        with:
          name: terraform-plan
          path: ${{ github.workspace }}/dev

      # Verify downloaded file
      - name: Check Downloaded Terraform Plan
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          Write-Host "Current directory:"
          Get-Location

          Write-Host "Downloaded files:"
          Get-ChildItem

          if (-not (Test-Path "tfplan")) {
            Write-Error "ERROR: Downloaded tfplan file was NOT found!"
            exit 1
          }

          Write-Host "SUCCESS: tfplan downloaded successfully."

      # Apply
      - name: Terraform Apply
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform apply -auto-approve tfplan