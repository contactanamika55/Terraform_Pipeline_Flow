name: Terraform Deploy

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - 'dev/**'
      - 'module/**'
      - '.github/workflows/deploymentpipe.yml'

  pull_request:
    branches:
      - main
    paths:
      - 'dev/**'
      - 'module/**'
      - '.github/workflows/deploymentpipe.yml'

permissions:
  contents: read

env:
  TF_WORKING_DIR: dev
  TF_VARS_FILE: terraform.tfvars

jobs:

  # ==================================================
  # 1. Terraform Scan / Validation / Plan
  # ==================================================
  terraform_plan:
    name: Terraform Scan & Plan
    runs-on: self-hosted

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Repository
        shell: powershell
        run: |
          Write-Host "Workspace:"
          Write-Host $env:GITHUB_WORKSPACE

          Write-Host "Repository files:"
          Get-ChildItem $env:GITHUB_WORKSPACE

          Write-Host "Dev files:"
          Get-ChildItem "$env:GITHUB_WORKSPACE\dev"

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Azure Account
        shell: powershell
        run: az account show

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Format Check
        working-directory: ${{ env.TF_WORKING_DIR }}
        shell: powershell
        run: terraform fmt -check -recursive

      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        shell: powershell
        run: terraform init

      - name: Terraform Validate
        working-directory: ${{ env.TF_WORKING_DIR }}
        shell: powershell
        run: terraform validate

      - name: Terraform Plan
        working-directory: ${{ env.TF_WORKING_DIR }}
        shell: powershell
        run: |
          terraform plan `
            -var-file="${{ env.TF_VARS_FILE }}" `
            -out=tfplan

      - name: Check Terraform Plan
        working-directory: ${{ env.TF_WORKING_DIR }}
        shell: powershell
        run: |
          Write-Host "Checking tfplan..."
          Get-ChildItem

          if (-not (Test-Path "tfplan")) {
            Write-Error "tfplan was not created"
            exit 1
          }

          Write-Host "tfplan created successfully"

      - name: Upload Terraform Plan
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan
          path: ${{ github.workspace }}/dev/tfplan
          if-no-files-found: error
          retention-days: 1


  # ==================================================
  # 2. Terraform Apply
  # ==================================================
  terraform_apply:
    name: Terraform Apply
    runs-on: self-hosted

    needs: terraform_plan

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Azure Account
        shell: powershell
        run: az account show

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        shell: powershell
        run: terraform init

      - name: Download Terraform Plan
        uses: actions/download-artifact@v4
        with:
          name: terraform-plan
          path: ${{ github.workspace }}/dev

      - name: Check Downloaded Plan
        working-directory: ${{ env.TF_WORKING_DIR }}
        shell: powershell
        run: |
          Write-Host "Checking downloaded tfplan..."
          Get-ChildItem

          if (-not (Test-Path "tfplan")) {
            Write-Error "tfplan was not downloaded"
            exit 1
          }

          Write-Host "tfplan downloaded successfully"

      - name: Terraform Apply
        working-directory: ${{ env.TF_WORKING_DIR }}
        shell: powershell
        run: |
          terraform apply -auto-approve tfplan