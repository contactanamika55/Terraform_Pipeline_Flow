name: Terraform Deploy

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - 'dev/**'
      - 'module/**'
      - '.github/workflows/deploymentpipe.yml'

  pull_request:
    branches:
      - main
    paths:
      - 'dev/**'
      - 'module/**'
      - '.github/workflows/deploymentpipe.yml'

permissions:
  contents: read

env:
  TF_WORKING_DIR: dev

jobs:

  terraform_plan:
    name: Terraform Plan
    runs-on: self-hosted

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Format
        working-directory: dev
        shell: powershell
        run: terraform fmt -check -recursive

      - name: Terraform Init
        working-directory: dev
        shell: powershell
        run: terraform init -input=false

      - name: Terraform Validate
        working-directory: dev
        shell: powershell
        run: terraform validate

      - name: Terraform Plan
        working-directory: dev
        shell: powershell
        run: |
          Write-Host "=========================================="
          Write-Host "TERRAFORM PLAN"
          Write-Host "=========================================="

          terraform plan -input=false -var-file="terraform.tfvars" -out="tfplan"

          if ($LASTEXITCODE -ne 0) {
            Write-Host "Terraform plan command failed."
            exit $LASTEXITCODE
          }

          Write-Host "Terraform plan command completed."

          Write-Host "=========================================="
          Write-Host "FILES IN DEV DIRECTORY"
          Write-Host "=========================================="

          Get-ChildItem -Force

          if (-not (Test-Path "tfplan")) {
            Write-Host "ERROR: tfplan does not exist."
            exit 1
          }

          Write-Host "SUCCESS: tfplan exists."

      - name: Upload Terraform Plan
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan
          path: ${{ github.workspace }}/dev/tfplan
          if-no-files-found: error
          retention-days: 1


  terraform_apply:
    name: Terraform Apply
    runs-on: self-hosted

    needs: terraform_plan

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        working-directory: dev
        shell: powershell
        run: terraform init -input=false

      - name: Download Terraform Plan
        uses: actions/download-artifact@v4
        with:
          name: terraform-plan
          path: ${{ github.workspace }}/dev

      - name: Verify Plan
        working-directory: dev
        shell: powershell
        run: |
          if (-not (Test-Path "tfplan")) {
            Write-Error "tfplan was not downloaded."
            exit 1
          }

          Write-Host "tfplan downloaded successfully."

      - name: Terraform Apply
        working-directory: dev
        shell: powershell
        run: |
          terraform apply -input=false -auto-approve tfplan

          if ($LASTEXITCODE -ne 0) {
            Write-Error "Terraform apply failed."
            exit $LASTEXITCODE
          }

          Write-Host "Terraform apply completed successfully."