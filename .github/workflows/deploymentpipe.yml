name: Terraform Deploy

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - 'dev/**'
      - 'module/**'
      - '.github/workflows/deploymentpipe.yml'

  pull_request:
    branches:
      - main
    paths:
      - 'dev/**'
      - 'module/**'
      - '.github/workflows/deploymentpipe.yml'

permissions:
  contents: read

env:
  TF_WORKING_DIR: dev

jobs:

  terraform_plan:
    name: Terraform Plan
    runs-on: self-hosted

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Format
        working-directory: dev
        shell: powershell
        run: terraform fmt -check -recursive

      - name: Terraform Init
        working-directory: dev
        shell: powershell
        run: terraform init -input=false

      - name: Terraform Validate
        working-directory: dev
        shell: powershell
        run: terraform validate

      - name: Terraform Plan
        working-directory: dev
        shell: powershell
        run: |
          terraform plan `
            -var-file="terraform.tfvars" `
            -out="$env:GITHUB_WORKSPACE\dev\tfplan"

      - name: Verify Terraform Plan
        shell: powershell
        run: |
          $planFile = Join-Path $env:GITHUB_WORKSPACE "dev\tfplan"

          Write-Host "Checking Terraform plan file..."
          Write-Host "Expected file: $planFile"

          if (-not (Test-Path $planFile)) {
              Write-Error "Terraform plan file was not created: $planFile"
              exit 1
          }

          Write-Host "Terraform plan file found successfully."
          Get-Item $planFile

      - name: Upload Terraform Plan
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan
          path: ${{ github.workspace }}/dev/tfplan
          if-no-files-found: error
          retention-days: 1


  terraform_apply:
    name: Terraform Apply
    runs-on: self-hosted

    needs: terraform_plan

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        working-directory: dev
        shell: powershell
        run: terraform init -input=false

      - name: Download Terraform Plan
        uses: actions/download-artifact@v4
        with:
          name: terraform-plan
          path: ${{ github.workspace }}/dev

      - name: Verify Downloaded Plan
        shell: powershell
        run: |
          $planFile = Join-Path $env:GITHUB_WORKSPACE "dev\tfplan"

          Write-Host "Checking downloaded Terraform plan..."
          Write-Host "Expected file: $planFile"

          if (-not (Test-Path $planFile)) {
              Write-Error "Terraform plan file was not downloaded."
              exit 1
          }

          Write-Host "Terraform plan downloaded successfully."
          Get-Item $planFile

      - name: Terraform Apply
        working-directory: dev
        shell: powershell
        run: terraform apply -auto-approve tfplan